name: Release

on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: 'Release version, e.g. 0.5.1 (no -SNAPSHOT)'
        required: true
      nextVersion:
        description: 'Next development version, e.g. 0.5.2 (no -SNAPSHOT; workflow appends it)'
        required: true

concurrency:
  group: release
  cancel-in-progress: false

env:
  MVN_CONFIG: -B -s $GITHUB_WORKSPACE/.github/settings.xml -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn
  RELEASE_VERSION: ${{ inputs.releaseVersion }}
  NEXT_VERSION: ${{ inputs.nextVersion }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout master
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Validate inputs and preconditions
        run: |
          for v in "$RELEASE_VERSION" "$NEXT_VERSION"; do
            if [[ ! "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid version format: $v" >&2
              exit 1
            fi
          done
          if git rev-parse "v$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "Tag v$RELEASE_VERSION already exists" >&2
            exit 1
          fi

      - name: Configure git author
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set release version
        run: ./mvnw versions:set -DnewVersion="$RELEASE_VERSION" -DprocessAllModules=true -DgenerateBackupPoms=false ${{ env.MVN_CONFIG }}

      - name: Commit and tag release
        run: |
          git commit -a -m "Release Chassis $RELEASE_VERSION"
          git tag "v$RELEASE_VERSION"

      - name: Deploy to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./mvnw deploy -DskipTests=true ${{ env.MVN_CONFIG }}

      - name: Set next development version
        run: ./mvnw versions:set -DnewVersion="$NEXT_VERSION-SNAPSHOT" -DprocessAllModules=true -DgenerateBackupPoms=false ${{ env.MVN_CONFIG }}

      - name: Commit next development version
        run: git commit -a -m "Prepare next release Chassis $NEXT_VERSION-SNAPSHOT"

      - name: Push master and tag
        run: git push --atomic origin master "v$RELEASE_VERSION"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$RELEASE_VERSION" --target "$(git rev-list -n1 "v$RELEASE_VERSION")" --title "v$RELEASE_VERSION" --generate-notes
