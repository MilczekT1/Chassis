# MANUAL RE-PUBLISH ONLY.
# Normal releases go through .github/workflows/release.yml, which opens the release PR, and
# .github/workflows/publish-release.yml, which deploys and tags once it merges. To retry a failed
# publish, dispatch publish-release.yml instead: it also tags and creates the GitHub Release.
# This workflow deploys whatever the checked-out ref holds. It does NOT bump versions, commit, or tag.
# Note: re-publishing a version that already exists in GitHub Packages will fail —
# that repository rejects re-deploying an existing release version.
name: Publish artifact (manual re-publish)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to re-publish (must already be committed on the checked-out ref). Informational.'
        required: false

env:
  MVN_CONFIG: -B -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Build with Maven
        run: ./mvnw package --file pom.xml -DskipTests=true ${{ env.MVN_CONFIG }}
      - name: Publish to GitHub Packages Apache Maven
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./mvnw deploy -s "$GITHUB_WORKSPACE/.github/settings.xml" ${{ env.MVN_CONFIG }}
