version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
    labels:
      - dependencies

  - package-ecosystem: maven
    # Multi-module reactors are handled from the root pom.
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "build"
    labels:
      - dependencies
    groups:
      # chassis-rewrite's rewrite.version must stay the OpenRewrite version rewrite-maven-plugin.version runs with
      openrewrite:
        patterns:
          - "org.openrewrite*"
