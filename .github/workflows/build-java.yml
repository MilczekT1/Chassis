name: Build Pipeline

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true
env:
  MVN_CONFIG: -B -s $GITHUB_WORKSPACE/.github/settings.xml -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 25
          distribution: temurin
          cache: maven
      - name: Build with Maven
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
          TESTCONTAINERS_RYUK_DISABLED: true
        run: ./mvnw clean install ${{ env.MVN_CONFIG }}
      - name: Freeze stores unchanged by the build
        run: |
          changed=$(git status --porcelain -- ':(glob)**/src/test/resources/archunit/frozen/**')
          if [ -n "$changed" ]; then
            echo "::error::The build changed Corral freeze stores. Run ./mvnw test locally and commit the store changes:"
            echo "$changed"
            exit 1
          fi
  # Fork PRs get no secrets, so SONAR_TOKEN is empty there. Dependabot PRs read SONAR_TOKEN from the
  # Dependabot secret store, not the Actions one.
  sonar_scan:
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 25
          distribution: temurin
          cache: maven
      - name: SonarCloud scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./mvnw clean verify sonar:sonar ${{ env.MVN_CONFIG }} \
            -Dsonar.token="$SONAR_TOKEN"
