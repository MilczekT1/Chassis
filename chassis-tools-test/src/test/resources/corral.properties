corral.property-prefix=chassis
corral.exclude.corral.spring.no-application-context-injection=chassis-tools-test provides JUnit extensions and TestExecutionListeners; they receive the test's ApplicationContext from the framework and can only resolve beans from it.
corral.exclude.corral.layering.no-test-libraries-in-production=chassis-tools-test is a test-utilities library; JUnit, AssertJ, Mockito and ArchUnit on its main classpath are its purpose.
