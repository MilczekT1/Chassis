# Prepares a release; .github/workflows/publish-release.yml deploys and tags it once the release PR
# merges. Nothing is tagged or deployed here: the rebase merge re-creates both commits on master, so a
# tag made from the release branch would point at a commit that never reaches master.
name: Release

on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: 'Release version, e.g. 0.5.1 (no -SNAPSHOT)'
        required: true
      nextVersion:
        description: 'Next development version, e.g. 0.5.2 (no -SNAPSHOT; workflow appends it)'
        required: true

concurrency:
  group: release
  cancel-in-progress: false

env:
  MVN_CONFIG: -B -s $GITHUB_WORKSPACE/.github/settings.xml -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn
  RELEASE_VERSION: ${{ inputs.releaseVersion }}
  NEXT_VERSION: ${{ inputs.nextVersion }}
  RELEASE_BRANCH: release/v${{ inputs.releaseVersion }}
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Authorize triggerer
        env:
          # Space-separated GitHub usernames allowed to run a release. Keep in sync with publish-release.yml.
          RELEASE_ALLOWED_ACTORS: "MilczekT1"
          TRIGGER_ACTOR: ${{ github.actor }}
        run: |
          for allowed in $RELEASE_ALLOWED_ACTORS; do
            if [[ "$allowed" == "$TRIGGER_ACTOR" ]]; then
              echo "$TRIGGER_ACTOR is authorized to release."
              exit 0
            fi
          done
          echo "::error::$TRIGGER_ACTOR is not authorized to trigger a release. Allowed: $RELEASE_ALLOWED_ACTORS" >&2
          exit 1

      - name: Checkout master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Generate GitHub App token
        id: app_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Validate inputs and preconditions
        run: |
          for v in "$RELEASE_VERSION" "$NEXT_VERSION"; do
            if [[ ! "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid version format: $v" >&2
              exit 1
            fi
          done
          if git rev-parse --verify --quiet "refs/tags/v$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "Tag v$RELEASE_VERSION already exists" >&2
            exit 1
          fi
          if git ls-remote --exit-code --heads origin "$RELEASE_BRANCH" >/dev/null 2>&1; then
            echo "Branch $RELEASE_BRANCH already exists on origin" >&2
            exit 1
          fi
      - name: Configure git author
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Create release branch
        run: git checkout -b "$RELEASE_BRANCH"
      - name: Set release version
        run: ./mvnw versions:set -DnewVersion="$RELEASE_VERSION" -DprocessAllModules=true -DgenerateBackupPoms=false ${{ env.MVN_CONFIG }}
      # publish-release.yml finds this commit on master by this exact subject.
      - name: Commit release version
        env:
          TRIGGER_ACTOR: ${{ github.actor }}
          TRIGGER_ACTOR_ID: ${{ github.actor_id }}
        run: |
          git commit -a -m "Release Chassis $RELEASE_VERSION" \
            -m "Co-authored-by: ${TRIGGER_ACTOR} <${TRIGGER_ACTOR_ID}+${TRIGGER_ACTOR}@users.noreply.github.com>"
      - name: Set next development version
        run: ./mvnw versions:set -DnewVersion="$NEXT_VERSION-SNAPSHOT" -DprocessAllModules=true -DgenerateBackupPoms=false ${{ env.MVN_CONFIG }}
      # publish-release.yml triggers on a master push whose head commit has this subject prefix.
      - name: Commit next development version
        run: git commit -a -m "Prepare next release Chassis $NEXT_VERSION-SNAPSHOT"
      - name: Push release branch
        run: git push origin "$RELEASE_BRANCH"

      - name: Open release pull request
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          TRIGGER_ACTOR: ${{ github.actor }}
        run: |
          body="Automated release PR for \`v$RELEASE_VERSION\`. Triggered by @${TRIGGER_ACTOR}. Merging it runs **Publish release**, which deploys \`$RELEASE_VERSION\` to GitHub Packages and tags it."
          gh pr create \
            --base master \
            --head "$RELEASE_BRANCH" \
            --title "Release Chassis $RELEASE_VERSION" \
            --body "$body" \
            --assignee "$TRIGGER_ACTOR" || \
          gh pr create \
            --base master \
            --head "$RELEASE_BRANCH" \
            --title "Release Chassis $RELEASE_VERSION" \
            --body "$body"

      # Rebase, not squash: publish-release.yml expects the release commit and the snapshot bump as
      # two separate commits on master, and the merge must be done by the App so its push triggers it.
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: gh pr merge "$RELEASE_BRANCH" --auto --rebase --delete-branch
