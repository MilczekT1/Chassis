type: specs.openrewrite.org/v1beta/recipe
name: io.github.milczekt1.chassis.UpgradeChassis
displayName: Upgrade Chassis
description: >-
  Upgrades a service to Chassis @@project.version@@ and makes only the edits the releases up to it would otherwise
  break. Adopts no new Chassis features and does not cover Spring Boot's or Spring Cloud's own changes.
  Run it with rewrite-maven-plugin @@rewrite-maven-plugin.version@@.
recipeList:
  # Before the version bump: it must import the contract BOM while chassis-bom still manages Spring Cloud Contract,
  # or the bump leaves "No version provided" markers on the service's versionless contract dependencies.
  - io.github.milczekt1.chassis.AddSpringCloudContractWhereUsed
  - io.github.milczekt1.chassis.rewrite.UpgradeChassisVersion:
      newVersion: "@@project.version@@"
  - io.github.milczekt1.chassis.rewrite.RemoveChassisTestMongoCleanupConfiguration
  - io.github.milczekt1.chassis.AddTestcontainersMongodbWhereUsed
  - io.github.milczekt1.chassis.AddSpringBootRestclientWhereUsed
---
type: specs.openrewrite.org/v1beta/recipe
name: io.github.milczekt1.chassis.AddTestcontainersMongodbWhereUsed
displayName: Add testcontainers-mongodb where tests use it
description: >-
  Needed when upgrading from Chassis 0.5.5 or earlier: chassis-tools-test no longer brings testcontainers-mongodb.
  Adds it at test scope to modules whose tests use Testcontainers' MongoDB classes and no longer get it.
recipeList:
  - org.openrewrite.maven.AddDependency:
      groupId: org.testcontainers
      artifactId: testcontainers-mongodb
      version: latest.release
      scope: test
      onlyIfUsing: org.testcontainers.mongodb..*
  - org.openrewrite.maven.AddDependency:
      groupId: org.testcontainers
      artifactId: testcontainers-mongodb
      version: latest.release
      scope: test
      onlyIfUsing: org.testcontainers.containers.MongoDBContainer
---
type: specs.openrewrite.org/v1beta/recipe
name: io.github.milczekt1.chassis.AddSpringBootRestclientWhereUsed
displayName: Add spring-boot-restclient where code uses it
description: >-
  Needed when upgrading from Chassis 0.5.5 or earlier: spring-cloud-context 5.1 (Spring Cloud 2026.0) no longer brings
  spring-boot-restclient. Adds it to modules whose code uses org.springframework.boot.restclient and no longer get it,
  at test scope when only tests use it.
recipeList:
  - org.openrewrite.maven.AddDependency:
      groupId: org.springframework.boot
      artifactId: spring-boot-restclient
      version: latest.release
      onlyIfUsing: org.springframework.boot.restclient..*
---
type: specs.openrewrite.org/v1beta/recipe
name: io.github.milczekt1.chassis.AddSpringCloudContractWhereUsed
displayName: Add Spring Cloud Contract where the service uses it
description: >-
  Needed when upgrading from Chassis 0.5.5 or earlier: chassis-tools-test no longer brings Spring Cloud Contract and
  chassis-bom no longer manages its versions. Imports spring-cloud-contract-dependencies in modules that declare a
  Spring Cloud Contract dependency, and adds spring-cloud-starter-contract-verifier or spring-cloud-contract-stub-runner
  to modules whose code uses them or that run spring-cloud-contract-maven-plugin.
recipeList:
  - org.openrewrite.maven.AddDependency:
      groupId: org.springframework.cloud
      artifactId: spring-cloud-starter-contract-verifier
      version: 5.0.3
      onlyIfUsing: org.springframework.cloud.contract.verifier..*
  - org.openrewrite.maven.AddDependency:
      groupId: org.springframework.cloud
      artifactId: spring-cloud-starter-contract-verifier
      version: 5.0.3
      onlyIfUsing: org.springframework.cloud.contract.spec..*
  - org.openrewrite.maven.AddDependency:
      groupId: org.springframework.cloud
      artifactId: spring-cloud-contract-stub-runner
      version: 5.0.3
      onlyIfUsing: org.springframework.cloud.contract.stubrunner..*
  - io.github.milczekt1.chassis.AddSpringCloudContractVerifierWherePluginRuns
  # Last, so it also covers the dependencies added above; earlier, a second cycle would import the BOM for them.
  - io.github.milczekt1.chassis.ImportSpringCloudContractDependenciesWhereDeclared
---
type: specs.openrewrite.org/v1beta/recipe
name: io.github.milczekt1.chassis.ImportSpringCloudContractDependenciesWhereDeclared
displayName: Import spring-cloud-contract-dependencies where a Spring Cloud Contract dependency is declared
description: >-
  Needed when upgrading from Chassis 0.5.5 or earlier: chassis-bom no longer manages Spring Cloud Contract's versions.
  Imports the spring-cloud-contract-dependencies BOM in modules that declare a Spring Cloud Contract dependency.
preconditions:
  - org.openrewrite.maven.search.FindDependency:
      groupId: org.springframework.cloud
      artifactId: spring-cloud-*contract*
recipeList:
  - org.openrewrite.maven.AddManagedDependency:
      groupId: org.springframework.cloud
      artifactId: spring-cloud-contract-dependencies
      version: 5.0.3
      type: pom
      scope: import
---
type: specs.openrewrite.org/v1beta/recipe
name: io.github.milczekt1.chassis.AddSpringCloudContractVerifierWherePluginRuns
displayName: Add spring-cloud-starter-contract-verifier where spring-cloud-contract-maven-plugin runs
description: >-
  Needed when upgrading from Chassis 0.5.5 or earlier: chassis-tools-test no longer brings
  spring-cloud-starter-contract-verifier, which the tests spring-cloud-contract-maven-plugin generates compile against.
preconditions:
  - org.openrewrite.maven.search.FindPlugin:
      groupId: org.springframework.cloud
      artifactId: spring-cloud-contract-maven-plugin
recipeList:
  - org.openrewrite.maven.AddDependency:
      groupId: org.springframework.cloud
      artifactId: spring-cloud-starter-contract-verifier
      version: 5.0.3
      scope: test
